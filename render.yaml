services:
  - type: web
    name: aula-nativa-server
    runtime: node
    region: ohio
    plan: starter
    rootDir: ./server
    buildCommand: npm install
    startCommand: node embeddings.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: MOCK_EMBEDDINGS
        value: "false"
    autoDeploy: true